tags: 
  -  Contacts
summary: Update contact
operationId: updateContact
description: 'Update a contact with payload'
security: 
  -  bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema: 
      type: string
      example: '67e6b1fdf47a3e03053d1833'
requestBody: 
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
          - isFavourite
          - contactType
        properties:
          name:
            description: "Contact's name"
            type: string
            example: "Andriy Pavlenko"
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: "+380000000003"
          email:
            description: "Contact's email"
            type: string
            example: "dmytro3@example.com"
          isFavourite:
            description: "Contact favourite or not"
            type: boolean
            example: false
          contactType:
            description: "Type of contact"
            type: string
            enum: ['work', 'home', 'personal']
          photo:
            description: "Student's photo"
            type: string
            format: binary
responses: 
  '200':
    description: 'Updates a contact'
    content:
      application/json:
        schema: 
          type: object
          required: 
            -  status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'